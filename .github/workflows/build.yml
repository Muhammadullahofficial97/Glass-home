name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unzip newest zip
        run: |
          f=$(git -c core.quotepath=false log --diff-filter=AM --name-only --format= -- '*.zip' | head -n 1)
          echo "Using: $f"
          unzip -qo "$f"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon
        working-directory: GlassHome
      - uses: actions/upload-artifact@v4
        with:
          name: GlassHome-apk
          path: GlassHome/app/build/outputs/apk/debug/app-debug.apk
